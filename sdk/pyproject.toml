[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micius"
version = "0.1.0"
description = "Qiskit client for the Micius multi-party quantum runtime"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "qiskit>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["micius"]
